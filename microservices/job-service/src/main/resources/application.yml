spring:
    application:
        name: job-service
    cloud:
        config:
            enabled: false
    datasource:
        url: jdbc:postgresql://localhost:5433/job_db
        username: user
        password: password
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

server:
    port: 8082

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
