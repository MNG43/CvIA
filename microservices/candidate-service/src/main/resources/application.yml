spring:
    application:
        name: candidate-service
    cloud:
        config:
            enabled: false
    datasource:
        url: jdbc:postgresql://localhost:5434/candidate_db
        username: user
        password: password
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
    kafka:
        bootstrap-servers: localhost:9092

server:
    port: 8083

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
