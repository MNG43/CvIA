services:
  # ---- Kafka (avec KRaft, sans Zookeeper) ----
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9092:9092"
    networks:
      - hr-network

  # ---- PostgreSQL pour Auth Service ----
  postgres-auth:
    image: postgres:16
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - hr-network

  # ---- PostgreSQL pour Job Service ----
  postgres-job:
    image: postgres:16
    container_name: postgres-job
    environment:
      POSTGRES_DB: job_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - job_data:/var/lib/postgresql/data
    networks:
      - hr-network

  # ---- PostgreSQL pour Candidate Service ----
  postgres-candidate:
    image: postgres:16
    container_name: postgres-candidate
    environment:
      POSTGRES_DB: candidate_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - candidate_data:/var/lib/postgresql/data
    networks:
      - hr-network

  # ---- PostgreSQL pour AI Service (avec PgVector) ----
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: postgres-vector
    environment:
      POSTGRES_DB: vector_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    volumes:
      - vector_data:/var/lib/postgresql/data
      - ./docker/init-vector-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hr-network

  # ---- Discovery Service (Eureka) ----
  discovery-service:
    build:
      context: ./microservices/discovery-service
      dockerfile: Dockerfile
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - hr-network

  # ---- Config Service ----
  config-service:
    build:
      context: ./microservices/config-service
      dockerfile: Dockerfile
    container_name: config-service
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
    depends_on:
      - discovery-service
    networks:
      - hr-network

  # ---- Auth Service ----
  auth-service:
    build:
      context: ./microservices/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_ENABLED: "false"
    depends_on:
      - postgres-auth
      - discovery-service
      - config-service
    networks:
      - hr-network

  # ---- Job Service ----
  job-service:
    build:
      context: ./microservices/job-service
      dockerfile: Dockerfile
    container_name: job-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-job:5432/job_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_ENABLED: "false"
    depends_on:
      - postgres-job
      - discovery-service
      - config-service
    networks:
      - hr-network

  # ---- Candidate Service ----
  candidate-service:
    build:
      context: ./microservices/candidate-service
      dockerfile: Dockerfile
    container_name: candidate-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-candidate:5432/candidate_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_ENABLED: "false"
    depends_on:
      - postgres-candidate
      - kafka
      - discovery-service
      - config-service
    networks:
      - hr-network

  # ---- AI Service ----
  ai-service:
    build:
      context: ./microservices/ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-vector:5432/vector_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_ENABLED: "false"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LOGGING_LEVEL_AI: DEBUG
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres-vector
      - kafka
      - discovery-service
      - config-service
    networks:
      - hr-network

  # ---- Notification Service ----
  notification-service:
    build:
      context: ./microservices/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "8085:8085"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_ENABLED: "false"
    depends_on:
      - kafka
      - discovery-service
      - config-service
    networks:
      - hr-network

  # ---- Gateway Service ----
  gateway-service:
    build:
      context: ./microservices/gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://discovery-service:8761/eureka/
      SPRING_CLOUD_CONFIG_ENABLED: "false"
    depends_on:
      - discovery-service
      - config-service
    networks:
      - hr-network

  # ---- Frontend Test ----
  frontend-test:
    build:
      context: ./frontend-test
      dockerfile: Dockerfile
    container_name: frontend-test
    ports:
      - "3000:80"
    depends_on:
      - gateway-service
      - ai-service
    networks:
      - hr-network

networks:
  hr-network:
    driver: bridge

volumes:
  auth_data:
  job_data:
  candidate_data:
  vector_data:
