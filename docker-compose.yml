services:
  # ---- Kafka (avec KRaft, sans Zookeeper) ----
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9092:9092"
    networks:
      - hr-network

  # ---- PostgreSQL pour Auth Service ----
  postgres-auth:
    image: postgres:16
    container_name: postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - hr-network

  # ---- PostgreSQL pour Job Service ----
  postgres-job:
    image: postgres:16
    container_name: postgres-job
    environment:
      POSTGRES_DB: job_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - job_data:/var/lib/postgresql/data
    networks:
      - hr-network

  # ---- PostgreSQL pour Candidate Service ----
  postgres-candidate:
    image: postgres:16
    container_name: postgres-candidate
    environment:
      POSTGRES_DB: candidate_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - candidate_data:/var/lib/postgresql/data
    networks:
      - hr-network

  # ---- PostgreSQL pour AI Service (avec PgVector) ----
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: postgres-vector
    environment:
      POSTGRES_DB: vector_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    volumes:
      - vector_data:/var/lib/postgresql/data
      - ./docker/init-vector-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hr-network

  # ---- AI Service ----
  ai-service:
    build:
      context: ./microservices/ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-vector:5432/vector_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_ENABLED: "false"
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    depends_on:
      - postgres-vector
      - kafka
    networks:
      - hr-network

networks:
  hr-network:
    driver: bridge

volumes:
  auth_data:
  job_data:
  candidate_data:
  vector_data:
